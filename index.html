<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>假的google translate</title>
</head>
<body>
    <div class="first-row">
        <div class="title">
            <h1>google 翻譯</h1>  
        </div>
        <div class="tools">
            <button>主題</button>
            <button>設定</button>
            <button>九宮格</button>
            <button>帳號</button>
        </div>
    </div>
    <div class="third-row">
        <div class="second-row">
            <div>
                <button>文字</button>
                <button>圖片</button>
                <button>文件</button>
                <button>網站</button>
            </div>
        </div>
        <div class="in-total">
            <div class="in-tools">
                <button>偵測語言</button>
                <button>日文</button>
                <button>中文(簡體)</button>
                <button>英文</button>
                <button>更多</button>
            </div>
            <div class="in">
                <input type="text" placeholder="輸入內容">
                <button class="mic">麥克風</button>
                <button class="other">其他輸入方式</button>
            </div>
        </div>
        <div class="changer">
            <div>
                <button>交換</button>
            </div>
        </div>
        <div class="out-total">
            <div class="out-tools">
                <button>偵測語言</button>
                <button>日文</button>
                <button>中文(簡體)</button>
                <button>英文</button>
                <button>更多</button>
            </div>
            <div class="out">
                <input type="text" placeholder="翻譯">
            </div>
        </div>
        <div class="comment">
            <p>提供意見</p>
    </div>
    </div>
    <div class="sixth-row">
        <div class="history">
            <div class="hisfam">
                <button>翻譯紀錄</button>
                <p>翻譯紀錄</p>
            </div>
        </div>
        <div class="saved">
            <div class="safam">
                <button>已儲存</button>
                <p>已儲存</p>
            </div>
        </div>
    </div>
</body>
</html>
